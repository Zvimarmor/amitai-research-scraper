# Proxies the browser's same-origin /api/* calls to the Mac mini via the tunnel,
# so the page needs no CORS grant and no hard-coded backend hostname.
# Equivalent to the single line in _redirects — keep one, not both.
[[redirects]]
  from = "/api/*"
  to = "https://ought-conference-camcorders-prayer.trycloudflare.com/api/:splat"
  status = 200
  force = true
